[project]
name = "jobs_orchestrator"
version = "0.1.0"
description = "Self-hosted Dagster orchestration for jobs-data-platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "dagster==1.13.15",
    "dagster-webserver==1.13.15",
    "duckdb==1.5.5",
    "google-cloud-bigquery==3.40.1",
    "google-cloud-storage==3.1.1",
    "python-dotenv==1.1.0",
    "PyYAML==6.0.3",
]

[build-system]
requires = ["hatchling>=1.19.0"]
build-backend = "hatchling.build"

[tool.dagster]
module_name = "jobs_orchestrator.definitions"
code_location_name = "jobs_orchestrator"

[tool.hatch.build.targets.wheel]
packages = ["jobs_orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"jobs_orchestrator/assets/gdelt_gkg/contracts.yml" = "jobs_orchestrator/assets/gdelt_gkg/contracts.yml"
