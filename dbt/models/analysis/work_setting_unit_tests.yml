version: 2
unit_tests:
  - name: jobs_detail_work_setting_role_contract
    description: Actual inline model over literal input mocks. Compile or run read-only SELECT validation; dbt test adapter may materialize temporary tables.
    model: jobs_detail
    given:
      - input: ref('dim_job_listings')
        format: sql
        fixture: work_setting_jobs
      - input: ref('jobs_detail_day')
        format: sql
        rows: |
          select cast(null as string) as job_id,
                 cast(null as float64) as avg_annual_pay_range,
                 cast(null as timestamp) as created_at_utc
          from unnest(array<int64>[]) as empty_row
    expect:
      rows:
        - {job_id: intellipro, work_setting: Hybrid}
        - {job_id: gdit, work_setting: Hybrid}
        - {job_id: walmart, work_setting: Office}
        - {job_id: fusionauth, work_setting: Unknown}
        - {job_id: technical_hybrid, work_setting: Unknown}
        - {job_id: technical_remote, work_setting: Unknown}
        - {job_id: policy, work_setting: Unknown}
        - {job_id: geo, work_setting: Remote}
        - {job_id: travel, work_setting: Remote}
        - {job_id: annual, work_setting: Remote}
        - {job_id: onboarding, work_setting: Remote}
        - {job_id: tag_conflict, work_setting: Unknown}
        - {job_id: tag_only, work_setting: Remote}
        - {job_id: tag_overridden, work_setting: Office}
        - {job_id: tag_same_sentence, work_setting: Office}
        - job_id: 'null'
          work_setting: Unknown
          work_setting_metadata:
            rule: insufficient_evidence
            evidence: []
            confidence: low
            conflict: false
        - {job_id: false_flag, work_setting: Unknown}
        - job_id: true_flag
          work_setting: Remote
          work_setting_metadata:
            rule: metadata_fallback
            evidence:
              - {source: serpapi_wfh, text: 'true', normalized: 'true', strength: 1, setting: Remote, conflict: false, negative_remote: false, office_days: null, remote_days: null}
            confidence: medium
            conflict: false
        - {job_id: title_remote, work_setting: Remote}
        - {job_id: title_office, work_setting: Office}
        - {job_id: title_hybrid, work_setting: Hybrid}
        - {job_id: title_override, work_setting: Office}
