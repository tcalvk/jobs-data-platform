version: 2

models:
  - name: jobs_detail
    description: Enriched job listing detail with listing lifecycle attributes.
    columns:
      - name: job_id
        data_tests:
          - unique
          - not_null
      - name: listing_status
        description: Active or removed listing lifecycle status.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Active
                  - Removed
      - name: work_setting
        data_type: string
        description: Role arrangement resolved inline; explicit evidence wins, then bounded company/duty inference with low confidence. Missing evidence remains Unknown, never defaults to Office.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Office', 'Hybrid', 'Remote', 'Unknown']
      - name: work_setting_metadata
        data_type: json
        description: Native JSON object with rule, evidence (full matched-fragment array), confidence (high explicit / medium metadata or tag / low inference or Unknown, not calibrated), and conflict (winning-strength boolean). Company and physical-duty inference have named low-confidence rules and original excerpts. Private source metadata is excluded.
        data_tests:
          - not_null
      - name: first_seen_at_utc
        description: Earliest retained dimension observation; experience extraction does not merge later snapshots or change dimension deduplication.
        data_tests:
          - not_null
      - name: required_years_experience
        data_type: int64
        description: >
          Explicit required applicant experience, never inferred from seniority.
          Range lower bound (including between X and Y); simultaneous thresholds use maximum; quantified degree
          alternatives use minimum valid path. Decimal years round up. Months below
          12 map to zero; otherwise months/12 rounds up. Explicit no experience is
          zero. A single compound year-and-month duration is combined before rounding;
          separate skill requirements still use the maximum, never their sum.
          Unspecified and unresolved ambiguous evidence are NULL. A separate
          mandatory minimum can dominate an unquantified alternative when a
          fully quantified valid path bounds that alternative below the minimum.
          Inputs are description, all heading-scoped highlights, explicit numeric
          title durations, SerpAPI extensions and LinkedIn fit-level metadata.
      - name: required_years_experience_metadata
        data_type: json
        description: >
          Audit object with status (explicit_requirement, unspecified, ambiguous)
          and evidence array of source, normalized text excerpt, resolved years and
          rule/status. Optional numeric evidence is retained as ignored_optional.
          Employer/coworker history, age, aggregate work/education totals and bonus
          eligibility are retained as ignored_non_applicant. Degree-credit arithmetic
          and location-dependent thresholds remain ambiguous rather than inferred.
          Bounded English parser, not a general natural-language inference engine.
        data_tests:
          - not_null
      - name: last_seen_at_utc
        data_tests:
          - not_null

  - name: search_term_opportunity_score_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month_start_date
              - search_term
              - search_location
    description: >
      Monthly search-term/location opportunity scoring table. Component scores are
      normalized to 0-100 by search location within each month, then combined into
      an opportunity score and tier.
    columns:
      - name: month_start_date
        description: First day of the scoring month.
        data_tests:
          - not_null
      - name: month
        description: Alias for month_start_date for downstream consumers.
        data_tests:
          - not_null
      - name: search_term
        description: Search term represented by the opportunity score row.
        data_tests:
          - not_null
      - name: search_location
        description: Search location represented by the opportunity score row.
        data_tests:
          - not_null
      - name: opportunity_score
        description: Weighted, re-normalized opportunity score across available components.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
          - not_null
      - name: demand_score
        description: Weighted, re-normalized demand score across available components.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: growth_score
        description: Normalized score representing month-over-month job growth.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: salary_score
        description: Normalized score representing salary opportunity.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: long_tail_score
        description: Normalized score representing employer diversity.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: opportunity_tier
        description: Business-friendly opportunity tier derived from opportunity_score.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Strong Opportunity
                  - Good Opportunity
                  - Moderate Opportunity
                  - Weak Opportunity
                  - Insufficient Data
