version: 2

models:
  - name: jobs_detail
    description: Enriched job listing detail with listing lifecycle attributes.
    columns:
      - name: job_id
        data_tests:
          - unique
          - not_null
      - name: listing_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Active
                  - Removed
      - name: first_seen_at_utc
        data_tests:
          - not_null
      - name: last_seen_at_utc
        data_tests:
          - not_null

  - name: search_term_opportunity_score_month
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - month_start_date
              - search_term
              - search_location
    description: >
      Monthly search-term/location opportunity scoring table. Component scores are
      normalized to 0-100 by search location within each month, then combined into
      an opportunity score and tier.
    columns:
      - name: month_start_date
        description: First day of the scoring month.
        data_tests:
          - not_null
      - name: month
        description: Alias for month_start_date for downstream consumers.
        data_tests:
          - not_null
      - name: search_term
        description: Search term represented by the opportunity score row.
        data_tests:
          - not_null
      - name: search_location
        description: Search location represented by the opportunity score row.
        data_tests:
          - not_null
      - name: opportunity_score
        description: Weighted, re-normalized opportunity score across available components.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
          - not_null
      - name: demand_score
        description: Weighted, re-normalized demand score across available components.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: growth_score
        description: Normalized score representing month-over-month job growth.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: salary_score
        description: Normalized score representing salary opportunity.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: long_tail_score
        description: Normalized score representing employer diversity.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: opportunity_tier
        description: Business-friendly opportunity tier derived from opportunity_score.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Strong Opportunity
                  - Good Opportunity
                  - Moderate Opportunity
                  - Weak Opportunity
                  - Insufficient Data
